---
- name: Render files consumed by Terraform
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vault.yml
    - backend-vault.yml
  tasks:
    - name: Render Terraform variables
      ansible.builtin.template:
        src: templates/secrets.auto.tfvars.j2
        dest: ../terraform/secrets.auto.tfvars
        mode: "0600"

    - name: Render Terraform backend configuration
      ansible.builtin.template:
        src: templates/backend.hcl.j2
        dest: ../terraform/backend.hcl
        mode: "0600"
