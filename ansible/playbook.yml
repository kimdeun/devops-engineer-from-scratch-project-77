---
- name: Prepare web servers and deploy the application
  hosts: web
  become: true
  vars_files:
    - vault.yml
  roles:
    - role: geerlingguy.docker
      tags: [prepare]
    - role: datadog.datadog
      tags: [monitoring]
  tasks:
    - name: Run application container
      community.docker.docker_container:
        name: "{{ application_container_name }}"
        image: "{{ application_image }}"
        pull: true
        restart_policy: unless-stopped
        published_ports:
          - "80:80"
      tags: [deploy]

    - name: Create project monitoring configuration directory
      ansible.builtin.file:
        path: /etc/project-77
        state: directory
        owner: root
        group: root
        mode: "0700"
      tags: [uptime]

    - name: Store Upmon heartbeat environment
      ansible.builtin.template:
        src: templates/upmon.env.j2
        dest: /etc/project-77/upmon.env
        owner: root
        group: root
        mode: "0600"
      no_log: true
      tags: [uptime]

    - name: Install Upmon heartbeat service
      ansible.builtin.template:
        src: templates/upmon-heartbeat.service.j2
        dest: /etc/systemd/system/project-77-upmon.service
        owner: root
        group: root
        mode: "0644"
      tags: [uptime]

    - name: Install Upmon heartbeat timer
      ansible.builtin.template:
        src: templates/upmon-heartbeat.timer.j2
        dest: /etc/systemd/system/project-77-upmon.timer
        owner: root
        group: root
        mode: "0644"
      tags: [uptime]

    - name: Enable and start Upmon heartbeat timer
      ansible.builtin.systemd_service:
        name: project-77-upmon.timer
        state: started
        enabled: true
        daemon_reload: true
      tags: [uptime]
